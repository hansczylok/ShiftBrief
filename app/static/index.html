<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hack Day Testseite</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 16px; }
    textarea { width: 100%; min-height: 80px; }
    #answer { white-space: pre-wrap; background: #f3f3f3; padding: 1rem; border-radius: 6px; min-height: 2rem; }
    button { margin: .5rem .5rem .5rem 0; padding: .5rem 1rem; }
  </style>
</head>
<body>
  <h1>Backend-Test</h1>
  <p>Gemma (Text + Bild) → Antwort → ElevenLabs liest vor.</p>
  <textarea id="prompt">Beschreibe dieses Bild in zwei Sätzen.</textarea>
  <p><input type="file" id="image" accept="image/*"></p>
  <button id="ask">Fragen</button>
  <button id="say" disabled>Vorlesen</button>
  <div id="answer"></div>
  <audio id="audio" controls hidden></audio>

  <script>
    const $ = (id) => document.getElementById(id);

    $("ask").onclick = async () => {
      $("answer").textContent = "…";
      const form = new FormData();
      form.append("prompt", $("prompt").value);
      if ($("image").files[0]) form.append("image", $("image").files[0]);
      const r = await fetch("/analyze", { method: "POST", body: form });
      const data = await r.json();
      $("answer").textContent = r.ok ? data.answer : data.detail;
      $("say").disabled = !r.ok;
    };

    $("say").onclick = async () => {
      const r = await fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: $("answer").textContent }),
      });
      if (!r.ok) { $("answer").textContent += "\n\n" + (await r.json()).detail; return; }
      $("audio").src = URL.createObjectURL(await r.blob());
      $("audio").hidden = false;
      $("audio").play();
    };
  </script>
</body>
</html>
